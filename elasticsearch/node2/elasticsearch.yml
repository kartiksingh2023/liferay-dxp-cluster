# ══════════════════════════════════════════════════════════════════
# Elasticsearch Node 2 Configuration
# Paired with: liferay-node2
# ══════════════════════════════════════════════════════════════════

cluster.name: LiferayElasticsearchCluster
node.name: es-node2

# This node is eligible to be master and holds data
node.roles: [master, data, ingest]

# ── Network ───────────────────────────────────────────────────────
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# ── Cluster Discovery ─────────────────────────────────────────────
# Both nodes discover each other by container name (Docker DNS)
discovery.seed_hosts: ["es-node1", "es-node2"]
cluster.initial_master_nodes: ["es-node1", "es-node2"]

# ── Security ──────────────────────────────────────────────────────
xpack.security.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false

# ── GeoIP ─────────────────────────────────────────────────────────
ingest.geoip.downloader.enabled: false

# ── Paths ─────────────────────────────────────────────────────────
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs

# ── Disk Watermarks ───────────────────────────────────────────────
cluster.routing.allocation.disk.threshold_enabled: true
cluster.routing.allocation.disk.watermark.low: "85%"
cluster.routing.allocation.disk.watermark.high: "90%"
cluster.routing.allocation.disk.watermark.flood_stage: "95%"

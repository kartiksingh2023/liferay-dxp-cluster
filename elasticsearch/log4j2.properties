###############################################################################
# Elasticsearch log4j2 Configuration
# Goal: suppress noisy startup template/ILM/S3 messages; readable text format
###############################################################################

status = error

# ── Appenders ────────────────────────────────────────────────────────────────

appender.console.type                = Console
appender.console.name                = console
appender.console.layout.type         = PatternLayout
appender.console.layout.pattern      = [%d{ISO8601}][%-5p][%-25c{1.}] [%node_name]%marker %m%n

appender.rolling.type                = RollingFile
appender.rolling.name                = rolling
appender.rolling.fileName            = ${sys:es.logs.base_path}${sys:file.separator}${sys:es.logs.cluster_name}.log
appender.rolling.layout.type         = PatternLayout
appender.rolling.layout.pattern      = [%d{ISO8601}][%-5p][%-25c{1.}] [%node_name]%marker %m%n
appender.rolling.filePattern         = ${sys:es.logs.base_path}${sys:file.separator}${sys:es.logs.cluster_name}-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.policies.type       = Policies
appender.rolling.policies.time.type  = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type  = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size  = 128MB
appender.rolling.strategy.type       = DefaultRolloverStrategy
appender.rolling.strategy.fileIndex  = nomax
appender.rolling.strategy.action.type = Delete
appender.rolling.strategy.action.basepath = ${sys:es.logs.base_path}
appender.rolling.strategy.action.condition.type = IfFileName
appender.rolling.strategy.action.condition.glob = ${sys:es.logs.cluster_name}-*
appender.rolling.strategy.action.condition.nested_condition.type    = IfAccumulatedFileSize
appender.rolling.strategy.action.condition.nested_condition.exceeds = 2GB

# ── Root logger ───────────────────────────────────────────────────────────────

rootLogger.level                   = info
rootLogger.appenderRef.console.ref = console
rootLogger.appenderRef.rolling.ref = rolling

# ── Suppress noisy startup loggers ───────────────────────────────────────────

# Hundreds of "adding index template / component template" messages on startup
logger.metadata_template.name  = org.elasticsearch.cluster.metadata.MetadataIndexTemplateService
logger.metadata_template.level = warn

# ILM policy registration noise
logger.ilm_put.name  = org.elasticsearch.xpack.ilm.action.TransportPutLifecycleAction
logger.ilm_put.level = warn

# Built-in index/template bootstrapping
logger.template_registry.name  = org.elasticsearch.xpack.core.template.IndexTemplateRegistry
logger.template_registry.level = warn

# Fleet / Elastic Agent template setup
logger.fleet_setup.name  = org.elasticsearch.xpack.fleet
logger.fleet_setup.level = warn

# APM / OTel template setup
logger.apm_setup.name  = org.elasticsearch.xpack.apm
logger.apm_setup.level = warn

# ILM scheduler
logger.ilm_scheduler.name  = org.elasticsearch.xpack.ilm
logger.ilm_scheduler.level = warn

# ── Suppress S3 entitlement WARN stack traces ─────────────────────────────────
# ES 8.x bundles repository-s3. On startup the AWS SDK probes for credential
# files. The ES entitlement system blocks those reads and emits a WARN + full
# stack trace for each attempt — even when S3 is not configured at all.
# All four loggers below are needed to silence it completely.

# The ES entitlement checker itself (emits the WARN)
logger.entitlement.name  = org.elasticsearch.entitlement
logger.entitlement.level = error

# The S3 repository plugin
logger.s3_plugin.name  = org.elasticsearch.repositories.s3
logger.s3_plugin.level = error

# AWS SDK profile/region resolution (the actual code triggering the probe)
logger.aws_profiles.name  = software.amazon.awssdk.profiles
logger.aws_profiles.level = error

logger.aws_regions.name  = software.amazon.awssdk.regions
logger.aws_regions.level = error

# ── Keep important loggers at INFO ────────────────────────────────────────────

logger.cluster_service.name  = org.elasticsearch.cluster.service.ClusterService
logger.cluster_service.level = info

logger.node.name  = org.elasticsearch.node
logger.node.level = info

logger.gateway.name  = org.elasticsearch.gateway
logger.gateway.level = info

logger.indices.name  = org.elasticsearch.indices
logger.indices.level = info

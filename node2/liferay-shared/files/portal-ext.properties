##
## portal-ext.properties — Liferay DXP Cluster Node 2
##

# ──────────────────────────────────────────────────────────────────
# Database — MySQL 8.4 (same schema as Node 1)
# ──────────────────────────────────────────────────────────────────
jdbc.default.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.default.url=jdbc:mysql://mysql:3306/lportal?characterEncoding=UTF-8&dontTrackOpenResources=true&holdResultsOpenOverStatementClose=true&serverTimezone=GMT&useFastDateParsing=false&useUnicode=true
jdbc.default.username=root
jdbc.default.password=root

# ──────────────────────────────────────────────────────────────────
# Clustering — JGroups TCP
# ──────────────────────────────────────────────────────────────────
cluster.link.enabled=true
cluster.link.channel.properties.control=/opt/liferay/jgroups/tcp.xml
cluster.link.channel.properties.transport.0=/opt/liferay/jgroups/tcp.xml

# ──────────────────────────────────────────────────────────────────
# Document Library — must match Node 1
# ──────────────────────────────────────────────────────────────────
dl.store.impl=com.liferay.portal.store.db.DBStore

# ──────────────────────────────────────────────────────────────────
# Cache replication across cluster nodes
# ──────────────────────────────────────────────────────────────────
ehcache.cluster.link.replication.enabled=true

# ──────────────────────────────────────────────────────────────────
# Session replication
# ──────────────────────────────────────────────────────────────────
portlet.session.replicate.enabled=true

# ──────────────────────────────────────────────────────────────────
# Security / Web
# ──────────────────────────────────────────────────────────────────
redirect.url.security.mode=domain

# Shows which node served the request in the page footer
web.server.display.node=true

# ──────────────────────────────────────────────────────────────────
# Setup
# ──────────────────────────────────────────────────────────────────
setup.wizard.enabled=false
auto.deploy.enabled=true
mail.session.mail=false
